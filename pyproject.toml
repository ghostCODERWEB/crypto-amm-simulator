[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-amm-simulator"
version = "0.1.0"
description = "Simulate integer reserve swaps, liquidity minting, fees and price impact without RPC access."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-amm-simulator = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
